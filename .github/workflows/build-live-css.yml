name: Compilar CSS en vivo
on:
  push:
    branches: [main]
    paths: ['live/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx --yes sass@1.69 --no-source-map --style=compressed --load-path=live live/live.scss docs/live.css
      - name: Commit docs/live.css
        run: |
          if git diff --quiet docs/live.css; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add docs/live.css
          git commit -m "build: docs/live.css [skip ci]"
          git push
